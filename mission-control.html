.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}.brand{font-size:24px;font-weight:950;color:var(--green);letter-spacing:.09em;text-shadow:0 0 14px #00ff6660}.sub{font-size:11px;color:var(--dim);margin-top:4px}.clock{font-size:12px;color:var(--green2)}

.card{background:linear-gradient(145deg,#06140af2,#020805f2);border:1px solid var(--line);padding:20px;border-radius:6px;box-shadow:0 0 30px #00ff6610}.hero{padding:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:13px}.hidden{display:none!important}.title{font-size:20px;font-weight:900;color:var(--green)}.big{font-size:44px;font-weight:950;color:var(--green)}
.muted{color:var(--dim)}.small{font-size:11px}.terminal{background:#000801;border:1px solid #0d3a1a;padding:14px;border-radius:4px;line-height:1.6;white-space:pre-wrap}
.status{display:inline-block;padding:4px 7px;border:1px solid currentColor;border-radius:3px;font-size:10px;font-weight:900}.online{color:var(--green)}.locked{color:#557060}.warnc{color:var(--yellow)}.red{color:var(--red)}
.progress{height:8px;background:#07170b;border:1px solid #164d25}.progress>div{height:100%;background:var(--green);box-shadow:0 0 12px #00ff66}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.core{padding:14px;border:1px solid #123f1f;background:#041008;margin:8px 0}.core b{display:block;color:var(--green2);margin-bottom:5px}
input,select,textarea{width:100%;background:#010703;border:1px solid #1b5a2c;color:var(--text);padding:12px;border-radius:3px;font:inherit;margin:6px 0 12px}textarea{min-height:100px;resize:vertical}
label{font-size:11px;color:var(--dim);display:block;margin-top:8px}.pin{letter-spacing:.45em;text-align:center;font-size:25px}
.matrix-table{width:100%;border-collapse:collapse;font-size:12px}.matrix-table th,.matrix-table td{border:1px solid #164d25;padding:8px;text-align:center}.matrix-table th{color:var(--green2);background:#07140a}.matrix-table td input,.matrix-table td select{margin:0;padding:7px;min-width:120px}
.live-dot{width:14px;height:14px;border-radius:50%;background:#27332b;border:1px solid #54645a;display:inline-block}.live-dot.on{background:var(--green);box-shadow:0 0 18px #00ff66;animation:pulse 1.1s infinite}.online-card{border-color:#00ff66;box-shadow:0 0 34px #00ff6635}
@keyframes pulse{50%{opacity:.45;transform:scale(.83)}}.countdown{font-size:min(28vw,170px);font-weight:950;color:var(--green);text-shadow:0 0 30px #00ff66;line-height:1}.global{text-align:center;border-color:#00ff66;box-shadow:0 0 60px #00ff6635}
.notice{position:fixed;right:8px;bottom:8px;z-index:30;font-size:10px;padding:6px 8px;border:1px solid #174d26;background:#020805;color:#5fa572;border-radius:3px}.footer{text-align:center;color:#315c3d;font-size:10px;margin:26px 0}
@media(max-width:650px){.brand{font-size:17px}.big{font-size:35px}.wrap{padding:10px}.hero{padding:19px}}

<body><canvas id="matrix"></canvas><div class="wrap"><header class="top"><div><div class="brand"><span class="mission-name">MISSION LIFELINE V13 // MISSION CONTROL</span></div><div class="sub">Erlebnisreich lernen // Esslingen am Neckar // Matrix Protocol</div></div><div class="clock" id="clock">--:--:--</div></header>
<section id="login" class="card hero"><div class="title">&gt;&gt; GAME MASTER LOGIN</div><label>E-Mail</label><input id="email" type="email" value="mail@horizonte-ggmbh.com"><label>Passwort</label><input id="password" type="password"><button id="loginBtn" class="primary">LOGIN</button><div id="loginMsg"></div></section>
<section id="dash" class="hidden"></section></div><div id="net" class="notice">READY</div><div class="footer">MISSION LIFELINE V13 MISSION CONTROL</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase,ref,set,update,onValue,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";
// MISSION LIFELINE V13 // EIGENES FIREBASE-PROJEKT
// Werte aus Firebase Console > Projekteinstellungen > Deine Apps > Web-App hier einsetzen.
const firebaseConfig = {
  apiKey: "AIzaSyCTALDZs8Y5DqJJ3fa9In6opksi1Uo3iRw",
  authDomain: "beat-the-box-5a67a.firebaseapp.com",
  databaseURL: "https://beat-the-box-5a67a-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "beat-the-box-5a67a",
  storageBucket: "beat-the-box-5a67a.firebasestorage.app",
  messagingSenderId: "506403256216",
  appId: "1:506403256216:web:dd1f40b793742635681ded"
};

const gameMasterEmail = "mail@horizonte-ggmbh.com";


const ROOT="missionV13", MIN_COUNT=2, MAX_COUNT=12;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>\"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
const idNum=(prefix,n)=>prefix+String(n).padStart(2,"0");
let db,auth,user,priv=null,states={},global={},attached=false;

async function sha(v){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function defaultStation(i){return {id:idNum("STATION_",i+1),name:"STATION "+(i+1),message:"Systemprüfung an Station "+(i+1)+" durchführen. Löst die physische Aufgabe und gebt anschließend den erhaltenen Code ein.",hints:["Prüft die Aufgabe noch einmal gemeinsam und achtet auf alle sichtbaren Informationen.","Teilt die Aufgabe in einzelne Schritte und vergleicht eure Beobachtungen.","Konzentriert euch auf das zentrale Lösungsprinzip der Station."]}}
function defaultTeam(i){return {id:idNum("TEAM_",i+1),name:["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT"][i]||"TEAM "+(i+1),pin:String(1001+i)}}
function buildConfig(teamCount=6,stationCount=6,old=null){
 const teams=Array.from({length:teamCount},(_,i)=>old?.teams?.[i]?{...old.teams[i],id:idNum("TEAM_",i+1)}:defaultTeam(i));
 const stations=Array.from({length:stationCount},(_,i)=>old?.stations?.[i]?{...old.stations[i],id:idNum("STATION_",i+1),hints:[...(old.stations[i].hints||[]),"",""].slice(0,3)}:defaultStation(i));
 const routes={},answers={},fragments={},finals={};
 teams.forEach((t,ti)=>{
   const oldTeam=old?.teams?.find(x=>x.id===t.id)||old?.teams?.[ti];
   const oldId=oldTeam?.id;
   const validOldRoute=(oldId&&old?.routes?.[oldId]||[]).filter(sid=>stations.some(s=>s.id===sid));
   const missing=stations.map(s=>s.id).filter(sid=>!validOldRoute.includes(sid));
   routes[t.id]=(validOldRoute.length===stationCount?[...validOldRoute]:[...stations.slice(ti%stationCount),...stations.slice(0,ti%stationCount)].map(s=>s.id));
   answers[t.id]={}; fragments[t.id]={};
   stations.forEach((s,si)=>{
     answers[t.id][s.id]=oldId&&old?.answers?.[oldId]?.[s.id]!==undefined?old.answers[oldId][s.id]:String(1100+(ti*stationCount)+si);
     fragments[t.id][s.id]=oldId&&old?.fragments?.[oldId]?.[s.id]!==undefined?old.fragments[oldId][s.id]:String.fromCharCode(65+(si%26))+(ti+1);
   });
   finals[t.id]=oldId&&old?.finals?.[oldId]!==undefined?old.finals[oldId]:"LIFELINE";
 });
 return {version:13,teamCount,stationCount,teams,stations,routes,answers,fragments,finals,countdownSeconds:Number(old?.countdownSeconds||10)};
}
async function publicFrom(p){
 const answerHashes={},finalHashes={};
 for(const t of p.teams){answerHashes[t.id]={};for(const s of p.stations)answerHashes[t.id][s.id]=await sha(String(p.answers[t.id]?.[s.id]??"").trim().toUpperCase());finalHashes[t.id]=await sha(String(p.finals[t.id]??"").trim().toUpperCase())}
 return {version:13,teams:p.teams.map(t=>({id:t.id,name:t.name,pin:t.pin})),stations:p.stations,routes:p.routes,answerHashes,fragments:p.fragments,finalHashes,countdownSeconds:p.countdownSeconds};
}
function empty(runId){return {runId,started:false,step:0,done:[],fragments:[],hints:0,hintUsage:{},penalty:0,online:false,lastUpdate:0}}
function teamIds(){return (priv?.teams||[]).map(t=>t.id)}
function st(id){return states[id]||empty(global.runId||0)}
function route(id){return priv?.routes?.[id]||[]}
function currentStationId(id){const s=st(id),r=route(id);return s.step<r.length?r[s.step]:null}
function stationById(id){return priv?.stations?.find(s=>s.id===id)||null}
function teamById(id){return priv?.teams?.find(t=>t.id===id)||null}
function missionRunning(){return global.status==="running"}

async function boot(){
 try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,async u=>{user=u;if(u&&String(u.email||"").toLowerCase()===String(gameMasterEmail).toLowerCase()){attach()}else if(u){$("loginMsg").innerHTML='<div class="terminal red">FALSCHES GAME-MASTER-KONTO<br>Angemeldet als: '+esc(u.email||"unbekannt")+'<br>Erwartet: '+esc(gameMasterEmail)+'</div>';await signOut(auth)}})}
 catch(e){$("loginMsg").innerHTML='<div class="terminal red">FIREBASE CONFIG ERROR<br>'+esc(e.message)+'</div>'}
}
$("loginBtn").onclick=async()=>{try{if(!auth)throw new Error("Firebase Authentication wurde noch nicht initialisiert.");const email=$("email").value.trim().toLowerCase();const password=$("password").value;$("loginMsg").innerHTML='<div class="terminal">AUTHENTIFIZIERUNG LÄUFT…</div>';await signInWithEmailAndPassword(auth,email,password)}catch(e){const code=e?.code||"";let msg=e?.message||String(e);if(code==="auth/invalid-credential"||code==="auth/wrong-password"||code==="auth/user-not-found")msg="E-Mail oder Passwort ist nicht korrekt.";else if(code==="auth/operation-not-allowed")msg="E-Mail/Passwort ist in Firebase Authentication nicht aktiviert.";else if(code==="auth/network-request-failed")msg="Keine Verbindung zu Firebase. Internetverbindung prüfen.";$("loginMsg").innerHTML='<div class="terminal red">LOGIN FEHLGESCHLAGEN<br>'+esc(msg)+'<br><span class="small">'+esc(code)+'</span></div>'}};
function attach(){if(attached)return;attached=true;$("login").classList.add("hidden");$("dash").classList.remove("hidden");onValue(ref(db,ROOT+"/privateConfig"),s=>{priv=s.val();priv?render():renderInit()});onValue(ref(db,ROOT+"/teams"),s=>{states=s.val()||{};render()});onValue(ref(db,ROOT+"/globalState"),s=>{global=s.val()||{};render()})}
function renderInit(){$("dash").innerHTML='<div class="card hero"><div class="title">&gt;&gt; V13 FIRST START</div><p class="muted">Neue flexible Datenstruktur initialisieren. Die bestehende V12 wird nicht berührt.</p><button id="init" class="primary">V13 INITIALISIEREN</button></div>';$("init").onclick=initialize}
async function initialize(){const p=buildConfig(6,6),pub=await publicFrom(p),runId=Date.now(),all={};p.teams.forEach(t=>all[t.id]=empty(runId));await set(ref(db,ROOT+"/privateConfig"),p);await set(ref(db,ROOT+"/publicConfig"),pub);await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:p.countdownSeconds});await set(ref(db,ROOT+"/teams"),all)}

function render(){
 if(!priv)return;
 const ids=teamIds(),total=ids.length,online=ids.filter(id=>st(id).online).length,stationCount=priv.stations.length,running=missionRunning();
 $("dash").innerHTML=`
 ${online===total&&total?`<div class="card hero global"><div class="title">${online} / ${total} ONLINE</div><div class="big">GLOBAL LIFELINE READY</div></div>`:""}
 <div class="card hero"><div class="title">LIVE MISSION CONTROL // V13 FLEX</div><div class="terminal">STATUS: ${running?"MISSION ACTIVE":"SETUP MODE"}\nFIELD UNITS ONLINE: ${online} / ${total}\nSTATIONEN: ${stationCount}</div><div class="row" style="margin-top:12px"><button id="newMission" class="primary">MISSION STARTEN / RESET</button><button id="setupMode" class="warn">SETUP FREIGEBEN</button><button id="logoutBtn">LOGOUT</button></div><label>Countdown Sekunden</label><input id="cd" type="number" min="3" max="120" value="${Number(global.countdownSeconds||priv.countdownSeconds||10)}"></div>
 <div class="card" style="margin-top:14px"><div class="title">MISSION SETUP</div><p class="small muted">Strukturänderungen sind nur im SETUP MODE möglich. Beim Ändern der Anzahl werden Teamstände zurückgesetzt; vorhandene Inhalte werden soweit möglich übernommen.</p><div class="row"><div><label>Anzahl Teams (${MIN_COUNT}–${MAX_COUNT})</label><input id="teamCount" type="number" min="${MIN_COUNT}" max="${MAX_COUNT}" value="${total}" ${running?"disabled":""}></div><div><label>Anzahl Stationen (${MIN_COUNT}–${MAX_COUNT})</label><input id="stationCount" type="number" min="${MIN_COUNT}" max="${MAX_COUNT}" value="${stationCount}" ${running?"disabled":""}></div></div><button id="applyStructure" class="primary" ${running?"disabled":""}>STRUKTUR ÜBERNEHMEN</button></div>
 <div class="grid" style="margin-top:14px">${priv.teams.map(t=>{const s=st(t.id),sid=currentStationId(t.id),c=sid?stationById(sid):null,rlen=route(t.id).length;return `<div class="card ${s.online?"online-card":""}"><div class="row"><div class="title">${esc(t.name)}</div><div style="flex:0"><span class="live-dot ${s.online?"on":""}"></span></div></div><div class="${s.online?"online":"muted"}" style="font-size:20px;font-weight:900">${s.online?"ONLINE":s.started?"ACTIVE":"OFFLINE"}</div><p>${Math.min(s.step,rlen)}/${rlen} • ${c?esc(c.name):"FINAL ACCESS"}</p><div class="progress"><div style="width:${rlen?Math.min(100,s.step/rlen*100):0}%"></div></div><p class="small muted">Hints: ${s.hints||0} • Penalty: ${s.penalty||0}</p><div class="row"><button data-next="${t.id}">FORCE NEXT</button><button data-reset="${t.id}" class="danger">RESET TEAM</button></div></div>`}).join("")}</div>
 <div class="card" style="margin-top:14px"><div class="title">TEAMS & ZUGANGSCODES</div>${priv.teams.map((t,i)=>`<div class="core"><b>TEAM ${i+1}</b><label>Name</label><input id="tn_${t.id}" value="${esc(t.name)}"><label>4-stelliger Teamcode</label><input id="pin_${t.id}" value="${esc(t.pin)}" maxlength="4" inputmode="numeric"></div>`).join("")}<button id="saveTeams">TEAMS SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">WECHSELMATRIX</div><p class="small muted">Jedes Team besucht jede Station genau einmal. Die Standardmatrix wird bei Strukturänderungen automatisch verteilt.</p><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${Array.from({length:stationCount},(_,i)=>`<th>POS ${i+1}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${route(t.id).map((sid,p)=>`<td><select id="r_${t.id}_${p}">${priv.stations.map(s=>`<option value="${s.id}" ${s.id===sid?"selected":""}>${esc(s.name)}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveRoutes">MATRIX SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">STATIONEN & SYSTEMMELDUNGEN</div>${priv.stations.map((s,i)=>`<div class="core"><b>STATION ${i+1}</b><label>Name</label><input id="sn_${s.id}" value="${esc(s.name)}"><label>System Message</label><textarea id="sm_${s.id}">${esc(s.message)}</textarea><label>Hinweis 1</label><textarea id="h_${s.id}_0">${esc(s.hints?.[0]||"")}</textarea><label>Hinweis 2</label><textarea id="h_${s.id}_1">${esc(s.hints?.[1]||"")}</textarea><label>Hinweis 3</label><textarea id="h_${s.id}_2">${esc(s.hints?.[2]||"")}</textarea></div>`).join("")}<button id="saveStations" class="primary">STATIONEN & HINWEISE SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">TEAM SOLUTIONS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.stations.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${priv.stations.map(s=>`<td><input id="a_${t.id}_${s.id}" value="${esc(priv.answers?.[t.id]?.[s.id]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveAnswers">LÖSUNGEN SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">TEAM FRAGMENTS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.stations.map(s=>`<th>${esc(s.name)}</th>`).join("")}</tr></thead><tbody>${priv.teams.map(t=>`<tr><th>${esc(t.name)}</th>${priv.stations.map(s=>`<td><input id="f_${t.id}_${s.id}" value="${esc(priv.fragments?.[t.id]?.[s.id]||"")}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveFragments">FRAGMENTE SPEICHERN</button></div>
 <div class="card" style="margin-top:14px"><div class="title">FINAL CODES</div>${priv.teams.map(t=>`<div class="core"><b>${esc(t.name)}</b><input id="fin_${t.id}" value="${esc(priv.finals?.[t.id]||"")}"></div>`).join("")}<button id="saveFinals">FINALCODES SPEICHERN</button></div>`;
 document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>forceNext(b.dataset.next));document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetTeam(b.dataset.reset));
 $("newMission").onclick=newMission;$("setupMode").onclick=enterSetup;$("logoutBtn").onclick=()=>signOut(auth);$("applyStructure").onclick=applyStructure;$("saveTeams").onclick=saveTeams;$("saveRoutes").onclick=saveRoutes;$("saveStations").onclick=saveStations;$("saveAnswers").onclick=saveAnswers;$("saveFragments").onclick=saveFragments;$("saveFinals").onclick=saveFinals;
}
async function sync(p){priv=p;p.teamCount=p.teams.length;p.stationCount=p.stations.length;p.countdownSeconds=Math.max(3,Math.min(120,Number($("cd")?.value||p.countdownSeconds||10)));await set(ref(db,ROOT+"/privateConfig"),p);await set(ref(db,ROOT+"/publicConfig"),await publicFrom(p));await update(ref(db,ROOT+"/globalState"),{countdownSeconds:p.countdownSeconds})}
async function enterSetup(){if(!confirm("SETUP MODE freigeben? Eine laufende Mission wird beendet und alle Team-Fortschritte werden zurückgesetzt."))return;const runId=Date.now(),all={};priv.teams.forEach(t=>all[t.id]=empty(runId));await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:Number($("cd").value||10)})}
async function newMission(){if(!confirm("Neue Mission starten und alle Teams auf Anfang setzen?"))return;const runId=Date.now(),all={};priv.teams.forEach(t=>all[t.id]=empty(runId));const sec=Math.max(3,Math.min(120,Number($("cd").value||10)));const p=clone(priv);p.countdownSeconds=sec;await sync(p);await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/globalState"),{runId,status:"running",countdownStartedAt:0,countdownSeconds:sec});alert("Mission gestartet.")}
async function applyStructure(){if(missionRunning()){alert("Struktur kann während einer laufenden Mission nicht geändert werden.");return}const tc=Number($("teamCount").value),sc=Number($("stationCount").value);if(!Number.isInteger(tc)||!Number.isInteger(sc)||tc<MIN_COUNT||tc>MAX_COUNT||sc<MIN_COUNT||sc>MAX_COUNT){alert("Teams und Stationen müssen zwischen "+MIN_COUNT+" und "+MAX_COUNT+" liegen.");return}if(!confirm(`Struktur auf ${tc} Teams und ${sc} Stationen ändern? Team-Fortschritte werden zurückgesetzt.`))return;const p=buildConfig(tc,sc,priv);await sync(p);const runId=Date.now(),all={};p.teams.forEach(t=>all[t.id]=empty(runId));await set(ref(db,ROOT+"/teams"),all);await set(ref(db,ROOT+"/globalState"),{runId,status:"setup",countdownStartedAt:0,countdownSeconds:p.countdownSeconds})}
async function saveTeams(){const p=clone(priv),pins=[];for(const t of p.teams){const name=$("tn_"+t.id).value.trim(),pin=$("pin_"+t.id).value.trim();if(!name){alert("Jedes Team benötigt einen Namen.");return}if(!/^\d{4}$/.test(pin)){alert("Jeder Teamcode muss genau 4-stellig sein.");return}t.name=name;t.pin=pin;pins.push(pin)}if(new Set(pins).size!==pins.length){alert("Teamcodes müssen eindeutig sein.");return}await sync(p);alert("Teams gespeichert.")}
async function saveRoutes(){const p=clone(priv),valid=new Set(p.stations.map(s=>s.id));for(const t of p.teams){const a=p.stations.map((_,i)=>$("r_"+t.id+"_"+i).value);if(a.some(x=>!valid.has(x))||new Set(a).size!==p.stations.length){alert("Jedes Team muss jede Station genau einmal besuchen.");return}p.routes[t.id]=a}await sync(p);alert("Wechselmatrix gespeichert.")}
async function saveStations(){const p=clone(priv);for(const s of p.stations){const name=$("sn_"+s.id).value.trim();if(!name){alert("Jede Station benötigt einen Namen.");return}s.name=name;s.message=$("sm_"+s.id).value.trim();s.hints=[0,1,2].map(i=>$("h_"+s.id+"_"+i).value.trim())}await sync(p);alert("Stationen und Hinweise gespeichert.")}
async function saveAnswers(){const p=clone(priv);for(const t of p.teams)for(const s of p.stations)p.answers[t.id][s.id]=$("a_"+t.id+"_"+s.id).value.trim();await sync(p);alert("Lösungen gespeichert.")}
async function saveFragments(){const p=clone(priv);for(const t of p.teams)for(const s of p.stations)p.fragments[t.id][s.id]=$("f_"+t.id+"_"+s.id).value.trim();await sync(p);alert("Fragmente gespeichert.")}
async function saveFinals(){const p=clone(priv);for(const t of p.teams)p.finals[t.id]=$("fin_"+t.id).value.trim();await sync(p);alert("Finalcodes gespeichert.")}
async function forceNext(id){const s=st(id),sid=currentStationId(id);if(!sid)return;const done=[...(s.done||[])];if(!done.includes(sid))done.push(sid);await update(ref(db,ROOT+"/teams/"+id),{step:s.step+1,done,fragments:[...(s.fragments||[]),priv.fragments?.[id]?.[sid]||""],lastUpdate:serverTimestamp()})}
async function resetTeam(id){const t=teamById(id);if(confirm("Team "+(t?.name||id)+" zurücksetzen?"))await set(ref(db,ROOT+"/teams/"+id),empty(global.runId||Date.now()))}
function tickClock(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tickClock();setInterval(tickClock,1000);
function startMatrix(){const c=document.getElementById("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}resize();addEventListener("resize",resize);function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()}
startMatrix();boot();
</script></body></html>
