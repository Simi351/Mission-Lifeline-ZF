<body><canvas id="matrix"></canvas><div class="wrap"><header class="top"><div><div class="brand"><span class="mission-name">MISSION LIFELINE // MISSION CONTROL</span></div><div class="sub">Safety Technology // Alfdorf // Mission Control</div></div><div class="clock" id="clock">--:--:--</div></header>
<section id="login" class="card hero"><div class="title">&gt;&gt; GAME MASTER LOGIN</div><label>E-Mail</label><input id="email" type="email" value="wolf@horizonte-ggmbh.com"><label>Passwort</label><input id="password" type="password"><button id="loginBtn" class="primary">LOGIN</button><div id="loginMsg"></div></section>

<script type="module">
import { firebaseConfig, gameMasterEmail } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import { getDatabase, ref, onValue, set, update, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";

const $=id=>document.getElementById(id),TEAMS=["ALPHA","BRAVO","CHARLIE","DELTA","ECHO","FOXTROT"];
let db,auth,user=null,priv=null,states={},global={},countdownDraft=null;
const DEFAULT={
 teams:{ALPHA:"3817",BRAVO:"6042",CHARLIE:"9153",DELTA:"2478",ECHO:"5361",FOXTROT:"8294"},
 cores:[
  {name:"NAVIGATION CORE",message:"Löst die physische Aufgabe vor Ort und gebt anschließend den Code ein."},
  {name:"LIFELINE CORE",message:"Arbeitet als Team und sichert den nächsten Zugangscode."},
  {name:"STABILITY CORE",message:"Die Systemstabilität ist kritisch. Löst die Aufgabe und übermittelt den Code."},
  {name:"BREACH CORE",message:"Absolviert die physische Mission und gebt anschließend den Code ein."},
  {name:"TRANSFER CORE",message:"Löst die Aufgabe an eurem Einsatzort und bestätigt den Code."},
  {name:"VELOCITY CORE",message:"Absolviert die finale physische Herausforderung."}
 ],
 routes:{ALPHA:[0,1,2,3,4,5],BRAVO:[1,2,3,4,5,0],CHARLIE:[2,3,4,5,0,1],DELTA:[3,4,5,0,1,2],ECHO:[4,5,0,1,2,3],FOXTROT:[5,0,1,2,3,4]},
 answers:{ALPHA:["1","32","12","25","6","8"],BRAVO:["1","32","12","25","6","8"],CHARLIE:["1","32","12","25","6","8"],DELTA:["1","32","12","25","6","8"],ECHO:["1","32","12","25","6","8"],FOXTROT:["1","32","12","25","6","8"]},
 fragments:{ALPHA:["N7","L4","S2","B9","T3","V5"],BRAVO:["N7","L4","S2","B9","T3","V5"],CHARLIE:["N7","L4","S2","B9","T3","V5"],DELTA:["N7","L4","S2","B9","T3","V5"],ECHO:["N7","L4","S2","B9","T3","V5"],FOXTROT:["N7","L4","S2","B9","T3","V5"]},
 finals:{ALPHA:"LIFE-A1",BRAVO:"LIFE-B2",CHARLIE:"LIFE-C3",DELTA:"LIFE-D4",ECHO:"LIFE-E5",FOXTROT:"LIFE-F6"},
 hints:[
  ["Beobachtet zuerst das System der Aufgabe, bevor ihr handelt.","Teilt Rollen im Team auf und prüft, welcher Schritt euch dem Ziel näherbringt.","Konzentriert euch auf die Reihenfolge und überprüft eure bisherige Annahme."],
  ["Nicht jede Information ist gleich wichtig. Sucht nach dem entscheidenden Muster.","Arbeitet parallel: Ein Teil des Teams beobachtet, der andere testet vorsichtig.","Überprüft, ob sich aus Position, Anzahl oder Reihenfolge ein eindeutiger Hinweis ergibt."],
  ["Stabilität entsteht durch klare Absprachen und kleine kontrollierte Schritte.","Verändert immer nur eine Sache gleichzeitig und beobachtet die Wirkung.","Nutzt eure Ressourcen so, dass Belastung und Gewicht möglichst gleichmäßig verteilt sind."],
  ["Plant den Weg vollständig, bevor die erste Person startet.","Achtet auf sichere Übergaben und feste Kommunikationssignale.","Der Schlüssel liegt in der gemeinsamen Bewegung, nicht in Einzelaktionen."],
  ["Denkt an einen verlustarmen Transfer vom Start bis zum Ziel.","Prüft, wo Material oder Information unterwegs verloren gehen kann.","Ordnet eure Rollen entlang des gesamten Transferwegs und schließt Lücken."],
  ["Geschwindigkeit hilft nur, wenn der Ablauf vorher klar ist.","Optimiert erst euren Prozess und startet dann den schnellen Versuch.","Legt eine feste Reihenfolge fest und vermeidet unnötige Wechsel oder Wege."]
 ]
};
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
async function sha(text){const data=new TextEncoder().encode(String(text));const d=await crypto.subtle.digest("SHA-256",data);return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}
async function publicFrom(p){const answerHashes={},finalHashes={};for(const n of TEAMS){answerHashes[n]=[];for(const a of p.answers[n])answerHashes[n].push(await sha(String(a).toUpperCase()));finalHashes[n]=await sha(String(p.finals[n]).toUpperCase())}return {teamPins:p.teams,cores:p.cores,routes:p.routes,answerHashes,fragments:p.fragments,finalHashes,hints:p.hints||DEFAULT.hints}}
function empty(runId){return {runId,started:false,step:0,done:[],fragments:[],hints:0,hintUsage:{},penalty:0,online:false,lastUpdate:0}}
async function boot(){const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,u=>{user=u;if(u&&u.email===gameMasterEmail)attach()})}
async function loginGM(){try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(e){$("loginMsg").innerHTML='<div class="terminal red">'+esc(e.code||e.message)+'</div>'}}
let attached=false;
function attach(){if(attached)return;attached=true;$("login").classList.add("hidden");$("dash").classList.remove("hidden");onValue(ref(db,"mission/privateConfig"),async s=>{priv=s.val();if(!priv){renderInit();return}if(!Array.isArray(priv.hints)){const p=JSON.parse(JSON.stringify(priv));p.hints=JSON.parse(JSON.stringify(DEFAULT.hints));priv=p;await set(ref(db,"mission/privateConfig"),p);await set(ref(db,"mission/publicConfig"),await publicFrom(p));return}render()});onValue(ref(db,"mission/teams"),s=>{states=s.val()||{};render()});onValue(ref(db,"mission/globalState"),s=>{global=s.val()||{};render()})}
function renderInit(){$("dash").innerHTML='<div class="card hero"><div class="title">&gt;&gt; FIRST START</div><button id="init" class="primary">INITIALIZE MISSION</button></div>';$("init").onclick=initialize}
async function initialize(){const p=JSON.parse(JSON.stringify(DEFAULT)),pub=await publicFrom(p),runId=Date.now(),all={};TEAMS.forEach(n=>all[n]=empty(runId));await set(ref(db,"mission/privateConfig"),p);await set(ref(db,"mission/publicConfig"),pub);await set(ref(db,"mission/globalState"),{runId,countdownStartedAt:0,countdownSeconds:10});for(const n of TEAMS)await set(ref(db,"mission/teams/"+n),all[n])}
function st(n){return states[n]||empty(global.runId||0)}function idx(n){const s=st(n),r=priv.routes[n];return s.step<r.length?r[s.step]:null}
function render(){if(!priv)return;const online=TEAMS.filter(n=>st(n).online).length;$("dash").innerHTML=`${online===6?'<div class="card hero global"><div class="title">6 / 6 ONLINE</div><div class="big">GLOBAL LIFELINE READY</div></div>':""}<div class="card hero"><div class="title">LIVE MISSION CONTROL</div><div class="terminal">FIELD UNITS ONLINE: ${online} / 6</div></div><div class="grid" style="margin-top:14px">${TEAMS.map(n=>{const s=st(n),i=idx(n),c=i===null?null:priv.cores[i];return `<div class="card ${s.online?"online-card":""}"><div class="row"><div class="title">${n}</div><div style="flex:0"><span class="live-dot ${s.online?"on":""}"></span></div></div><div class="${s.online?"online":"muted"}" style="font-size:20px;font-weight:900">${s.online?"ONLINE":s.started?"ACTIVE":"OFFLINE"}</div><p>${s.step}/6 • ${c?esc(c.name):"FINAL ACCESS"}</p><div class="progress"><div style="width:${s.step/6*100}%"></div></div><p class="small muted">Hints: ${s.hints||0} • Penalty: ${s.penalty||0}</p><div class="row"><button data-next="${n}">FORCE NEXT</button><button data-reset="${n}" class="danger">RESET TEAM</button></div></div>`}).join("")}</div>
<div class="card" style="margin-top:14px"><div class="title">NEW MISSION / COUNTDOWN</div><label>Countdown Sekunden</label><input id="cd" type="number" min="3" max="60" value="${countdownDraft!==null?countdownDraft:(global.countdownSeconds||10)}"><button id="newMission" class="primary">START NEW MISSION / RESET ALL</button></div>
<div class="card" style="margin-top:14px"><div class="title">TEAM CODES</div>${TEAMS.map(n=>`<div class="core"><b>${n}</b><input id="pin_${n}" value="${esc(priv.teams[n])}" maxlength="4"></div>`).join("")}<button id="savePins">SAVE TEAM CODES</button></div>
<div class="card" style="margin-top:14px"><div class="title">WECHSELMATRIX</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${[1,2,3,4,5,6].map(i=>`<th>POS ${i}</th>`).join("")}</tr></thead><tbody>${TEAMS.map(n=>`<tr><th>${n}</th>${priv.routes[n].map((v,p)=>`<td><select id="r_${n}_${p}">${priv.cores.map((c,i)=>`<option value="${i}" ${i===v?"selected":""}>${esc(c.name)}</option>`).join("")}</select></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveRoutes">SAVE MATRIX</button></div>
<div class="card" style="margin-top:14px"><div class="title">TEAM SOLUTIONS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.cores.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr></thead><tbody>${TEAMS.map(n=>`<tr><th>${n}</th>${priv.answers[n].map((v,i)=>`<td><input id="a_${n}_${i}" value="${esc(v)}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveAnswers">SAVE SOLUTIONS</button></div>
<div class="card" style="margin-top:14px"><div class="title">TEAM FRAGMENTS</div><div style="overflow:auto"><table class="matrix-table"><thead><tr><th>TEAM</th>${priv.cores.map(c=>`<th>${esc(c.name)}</th>`).join("")}</tr></thead><tbody>${TEAMS.map(n=>`<tr><th>${n}</th>${priv.fragments[n].map((v,i)=>`<td><input id="f_${n}_${i}" value="${esc(v)}"></td>`).join("")}</tr>`).join("")}</tbody></table></div><button id="saveFragments">SAVE FRAGMENTS</button></div>
<div class="card" style="margin-top:14px"><div class="title">FINAL CODES</div>${TEAMS.map(n=>`<div class="core"><b>${n}</b><input id="fin_${n}" value="${esc(priv.finals[n])}"></div>`).join("")}<button id="saveFinals">SAVE FINAL CODES</button></div>
<div class="card" style="margin-top:14px"><div class="title">CORE MESSAGES</div>${priv.cores.map((c,i)=>`<div class="core"><b>CORE ${i+1}</b><label>Name</label><input id="cn_${i}" value="${esc(c.name)}"><label>System Message</label><textarea id="cm_${i}">${esc(c.message)}</textarea></div>`).join("")}<button id="saveCores">SAVE CORES</button></div>
<div class="card" style="margin-top:14px"><div class="title">AUTARKE STATIONSHINWEISE</div><p class="small muted">Pro Station können drei Hinweisstufen vorbereitet werden. Die Teams rufen sie selbstständig nacheinander ab; Mission Control muss dafür nicht besetzt sein.</p>${priv.cores.map((c,i)=>`<div class="core"><b>${esc(c.name)} // HINWEISE</b>${[0,1,2].map(h=>`<label>Hinweis ${h+1}</label><textarea id="h_${i}_${h}">${esc((priv.hints||DEFAULT.hints)[i]?.[h]||"")}</textarea>`).join("")}</div>`).join("")}<button id="saveHints" class="primary">SAVE STATION HINTS</button></div>`;
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>forceNext(b.dataset.next));document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>resetTeam(b.dataset.reset));$("cd").oninput=()=>{const v=Number($("cd").value);if(Number.isFinite(v))countdownDraft=Math.max(3,Math.min(60,v))};$("newMission").onclick=newMission;$("savePins").onclick=savePins;$("saveRoutes").onclick=saveRoutes;$("saveAnswers").onclick=saveAnswers;$("saveFragments").onclick=saveFragments;$("saveFinals").onclick=saveFinals;$("saveCores").onclick=saveCores;$("saveHints").onclick=saveHints}
async function sync(p){priv=p;await set(ref(db,"mission/privateConfig"),p);await set(ref(db,"mission/publicConfig"),await publicFrom(p))}
async function newMission(){if(!confirm("Neue Mission starten und alle Teams zurücksetzen?"))return;const seconds=Math.max(3,Math.min(60,Number(countdownDraft!==null?countdownDraft:(global.countdownSeconds||10))));const runId=Date.now(),all={};TEAMS.forEach(n=>all[n]=empty(runId));for(const n of TEAMS)await set(ref(db,"mission/teams/"+n),all[n]);await set(ref(db,"mission/globalState"),{runId,countdownStartedAt:0,countdownSeconds:seconds});countdownDraft=seconds;alert("Neue Mission gestartet. Countdown: "+seconds+" Sekunden.")}
async function savePins(){const p=JSON.parse(JSON.stringify(priv)),vals=TEAMS.map(n=>$("pin_"+n).value.trim());if(vals.some(v=>!/^[0-9]{4}$/.test(v))||new Set(vals).size!==6){alert("Codes müssen eindeutig und 4-stellig sein.");return}TEAMS.forEach((n,i)=>p.teams[n]=vals[i]);await sync(p)}
async function saveRoutes(){const p=JSON.parse(JSON.stringify(priv));for(const n of TEAMS){const a=[0,1,2,3,4,5].map(i=>Number($("r_"+n+"_"+i).value));if(new Set(a).size!==6){alert("Jeder Core muss genau einmal vorkommen.");return}p.routes[n]=a}await sync(p)}
async function saveAnswers(){const p=JSON.parse(JSON.stringify(priv));TEAMS.forEach(n=>p.answers[n]=p.cores.map((_,i)=>$("a_"+n+"_"+i).value.trim()));await sync(p)}
async function saveFragments(){const p=JSON.parse(JSON.stringify(priv));TEAMS.forEach(n=>p.fragments[n]=p.cores.map((_,i)=>$("f_"+n+"_"+i).value.trim()));await sync(p)}
async function saveFinals(){const p=JSON.parse(JSON.stringify(priv));TEAMS.forEach(n=>p.finals[n]=$("fin_"+n).value.trim());await sync(p)}
async function saveCores(){const p=JSON.parse(JSON.stringify(priv));p.cores=p.cores.map((c,i)=>({name:$("cn_"+i).value.trim(),message:$("cm_"+i).value.trim()}));await sync(p)}
async function saveHints(){const p=JSON.parse(JSON.stringify(priv));p.hints=p.cores.map((_,i)=>[0,1,2].map(h=>$("h_"+i+"_"+h).value.trim()));await sync(p);alert("Stationshinweise gespeichert.")}
async function forceNext(n){const s=st(n),i=idx(n);if(i===null)return;const done=[...(s.done||[])];if(!done.includes(i))done.push(i);await update(ref(db,"mission/teams/"+n),{step:s.step+1,done,fragments:[...(s.fragments||[]),priv.fragments[n][i]],lastUpdate:serverTimestamp()})}
async function resetTeam(n){if(confirm("Team "+n+" zurücksetzen?"))await set(ref(db,"mission/teams/"+n),empty(global.runId||Date.now()))}
$("loginBtn").onclick=loginGM;function tick(){$("clock").textContent=new Date().toLocaleTimeString("de-DE")}tick();setInterval(tick,1000);

function startMatrix(){
 const c=document.getElementById("matrix"),x=c.getContext("2d"),chars="01アイウエオABCDEFGHIJKLMNOPQRSTUVWXYZ#$%",size=15;let drops=[];
 function resize(){c.width=innerWidth;c.height=innerHeight;drops=Array(Math.max(1,Math.floor(c.width/size))).fill(1)}
 resize();addEventListener("resize",resize);
 function f(){x.fillStyle="rgba(1,3,1,.10)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#00ff66";x.font=size+"px monospace";drops.forEach((y,i)=>{x.fillText(chars[Math.floor(Math.random()*chars.length)],i*size,y*size);if(y*size>c.height&&Math.random()>.975)drops[i]=0;drops[i]++});requestAnimationFrame(f)}f()
}

startMatrix();boot();
</script></body></html>
